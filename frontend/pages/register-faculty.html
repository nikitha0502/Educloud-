<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Registration — EduCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css" />
  <style>
    body { background: linear-gradient(135deg, #1c1917, #78350f, #b45309); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .auth-wrapper { width: 100%; max-width: 480px; }
    .auth-brand { text-align: center; margin-bottom: 28px; }
    .auth-brand-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #fde68a, #f59e0b); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px; }
    .auth-brand h1 { font-size: 24px; font-weight: 800; color: #fff; }
    .auth-brand p  { color: rgba(255,255,255,.6); font-size: 14px; }
    .auth-card { background: #fff; border-radius: 20px; padding: 36px; box-shadow: 0 25px 60px rgba(0,0,0,.35); }
    .auth-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .auth-card .subtitle { color: var(--gray-500); font-size: 14px; margin-bottom: 28px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray-500); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media(max-width:480px) { .form-row { grid-template-columns: 1fr; } }
    .password-wrapper { position: relative; }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 18px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,.7); font-size: 14px; font-weight: 500; margin-bottom: 16px; }
    .back-link:hover { color: #fff; }
    .strength-bar { margin-top: 6px; }
    .strength-bar-track { height: 4px; background: var(--gray-200); border-radius: 999px; overflow: hidden; }
    .strength-bar-fill { height: 100%; border-radius: 999px; transition: width .3s, background .3s; }
    .strength-label { font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <a href="../index.html" class="back-link">← Back to Home</a>

    <div class="auth-brand">
      <div class="auth-brand-icon">👩‍🏫</div>
      <h1>Faculty Registration</h1>
      <p>Create your faculty account to manage assignments</p>
    </div>

    <div class="auth-card">
      <h2>Join as Faculty 🏫</h2>
      <p class="subtitle">Complete the form to create your faculty account</p>

      <form id="register-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First Name <span class="required">*</span></label>
            <input type="text" id="first-name" class="form-control" placeholder="Dr. Sarah" />
            <div class="form-error" id="first-name-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last Name <span class="required">*</span></label>
            <input type="text" id="last-name" class="form-control" placeholder="Johnson" />
            <div class="form-error" id="last-name-error"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Institutional Email <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="faculty@university.edu" autocomplete="email" />
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="department">Department <span class="required">*</span></label>
          <select id="department" class="form-control">
            <option value="">Select your department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics &amp; Communication</option>
            <option value="Mechanical">Mechanical Engineering</option>
            <option value="Civil">Civil Engineering</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Management">Management Studies</option>
            <option value="Other">Other</option>
          </select>
          <div class="form-error" id="dept-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="designation">Designation</label>
          <select id="designation" class="form-control">
            <option value="">Select designation</option>
            <option value="Professor">Professor</option>
            <option value="Associate Professor">Associate Professor</option>
            <option value="Assistant Professor">Assistant Professor</option>
            <option value="Lecturer">Lecturer</option>
            <option value="Visiting Faculty">Visiting Faculty</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Create a strong password" autocomplete="new-password" oninput="checkStrength(this.value)" />
            <button type="button" class="password-toggle" id="toggle-pwd">👁️</button>
          </div>
          <div class="strength-bar" id="strength-bar" style="display:none;">
            <div class="strength-bar-track"><div class="strength-bar-fill" id="strength-fill" style="width:0%;"></div></div>
            <div class="strength-label" id="strength-label"></div>
          </div>
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" class="form-control" placeholder="Repeat your password" autocomplete="new-password" />
            <button type="button" class="password-toggle" id="toggle-confirm">👁️</button>
          </div>
          <div class="form-error" id="confirm-error"></div>
        </div>

        <div style="margin-bottom:20px;">
          <label style="display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--gray-600);cursor:pointer;">
            <input type="checkbox" id="terms" style="margin-top:2px;" />
            I agree to the <a href="#" style="color:var(--primary);margin:0 2px;">Terms of Service</a> and <a href="#" style="color:var(--primary);">Privacy Policy</a>
          </label>
          <div class="form-error" id="terms-error"></div>
        </div>

        <div id="register-error" class="alert alert-danger" style="display:none;"></div>
        <div id="register-success" class="alert alert-success" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
          Create Faculty Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
        &nbsp;·&nbsp; Student? <a href="register-student.html">Student Registration</a>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-db.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    showMockBanner();

    function initToggle(btnId, inputId) {
      document.getElementById(btnId).addEventListener('click', function() {
        const inp = document.getElementById(inputId);
        if (inp.type === 'password') { inp.type = 'text'; this.textContent = '🙈'; }
        else { inp.type = 'password'; this.textContent = '👁️'; }
      });
    }
    initToggle('toggle-pwd', 'password');
    initToggle('toggle-confirm', 'confirm-password');

    function checkStrength(val) {
      const bar = document.getElementById('strength-bar');
      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      if (!val) { bar.style.display = 'none'; return; }
      bar.style.display = 'block';
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { w: '25%', color: '#ef4444', text: 'Weak' },
        { w: '50%', color: '#f59e0b', text: 'Fair' },
        { w: '75%', color: '#3b82f6', text: 'Good' },
        { w: '100%', color: '#10b981', text: 'Strong' },
      ];
      const lvl = levels[score - 1] || levels[0];
      fill.style.width = lvl.w;
      fill.style.background = lvl.color;
      label.textContent = lvl.text;
      label.style.color = lvl.color;
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errorDiv = document.getElementById('register-error');
      const successDiv = document.getElementById('register-success');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      let valid = true;
      valid = validateRequired('first-name', 'first-name-error', 'First name is required.') && valid;
      valid = validateRequired('last-name', 'last-name-error', 'Last name is required.') && valid;
      valid = validateEmail('email', 'email-error') && valid;
      valid = validateRequired('department', 'dept-error', 'Please select your department.') && valid;
      valid = validatePassword('password', 'password-error') && valid;

      const pwd = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirm-password').value;
      if (pwd !== confirmPwd) {
        document.getElementById('confirm-password').classList.add('is-invalid');
        document.getElementById('confirm-error').textContent = 'Passwords do not match.';
        document.getElementById('confirm-error').classList.add('visible');
        valid = false;
      } else {
        document.getElementById('confirm-password').classList.remove('is-invalid');
        document.getElementById('confirm-error').classList.remove('visible');
      }

      if (!document.getElementById('terms').checked) {
        document.getElementById('terms-error').textContent = 'You must accept the terms.';
        document.getElementById('terms-error').classList.add('visible');
        valid = false;
      } else {
        document.getElementById('terms-error').classList.remove('visible');
      }

      if (!valid) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Creating account…';

      try {
        const name = `${document.getElementById('first-name').value.trim()} ${document.getElementById('last-name').value.trim()}`;
        const dept = document.getElementById('department').value;
        const desig = document.getElementById('designation').value;
        const res = await API.Auth.register({
          name,
          email: document.getElementById('email').value.trim().toLowerCase(),
          password: pwd,
          role: 'faculty',
          department: dept + (desig ? ` — ${desig}` : ''),
        });

        if (!res.success) {
          errorDiv.innerHTML = `<span class="alert-icon">❌</span> ${escapeHtml(res.message)}`;
          errorDiv.style.display = 'flex';
          return;
        }

        successDiv.innerHTML = `<span class="alert-icon">✅</span> Faculty account created! Redirecting to login…`;
        successDiv.style.display = 'flex';
        showToast('Registration successful! Welcome aboard! 🎉', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);

      } catch (err) {
        errorDiv.innerHTML = `<span class="alert-icon">❌</span> ${escapeHtml(err.message || 'Registration failed.')}`;
        errorDiv.style.display = 'flex';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Create Faculty Account';
      }
    });
  </script>
</body>
</html>
