<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard — EduCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css" />
  <style>
    .assignment-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gray-200);
      padding: var(--space-5);
      transition: all var(--transition-base);
      display: flex; flex-direction: column; gap: var(--space-3);
      position: relative; overflow: hidden;
    }
    .assignment-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--primary-light), var(--primary));
    }
    .assignment-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .assignment-card.overdue::before { background: linear-gradient(90deg, #fca5a5, var(--danger)); }
    .assignment-card.submitted::before { background: linear-gradient(90deg, #6ee7b7, var(--success)); }
    .assignment-card.late::before { background: linear-gradient(90deg, #fde68a, var(--warning)); }
    .asgn-title { font-size: 1rem; font-weight: 700; color: var(--gray-900); }
    .asgn-desc  { font-size: 0.875rem; color: var(--gray-500); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .asgn-meta  { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .asgn-meta-item { display: flex; align-items: center; gap: 4px; font-size: 0.8125rem; color: var(--gray-500); }
    .asgn-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

    .deadline-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: var(--radius-full);
      font-size: 0.75rem; font-weight: 600;
    }
    .deadline-chip.safe    { background: #d1fae5; color: #065f46; }
    .deadline-chip.warning { background: #fef3c7; color: #92400e; }
    .deadline-chip.danger  { background: #fee2e2; color: #991b1b; }
    .deadline-chip.expired { background: var(--gray-100); color: var(--gray-500); }

    .welcome-banner {
      background: linear-gradient(135deg, #4f46e5 0%, #312e81 50%, #1e1b4b 100%);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      color: #fff;
      position: relative; overflow: hidden;
      margin-bottom: var(--space-6);
    }
    .welcome-banner::after {
      content: '🎓';
      position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
      font-size: 5rem; opacity: .15;
    }
    .welcome-banner h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    .welcome-banner p  { color: rgba(255,255,255,.75); font-size: 14px; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

    .upcoming-deadline {
      background: #fff;
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-200);
      padding: var(--space-3) var(--space-4);
      display: flex; align-items: center; justify-content: space-between;
      transition: all var(--transition-fast);
    }
    .upcoming-deadline:hover { border-color: var(--primary); }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🎓</div>
        <div>
          <div class="sidebar-logo-text">EduCloud</div>
          <div class="sidebar-logo-sub">Student Portal</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><span class="nav-section-label">Main</span></div>
        <a class="nav-item active" data-page="dashboard" href="student-dashboard.html">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a class="nav-item" data-page="assignments" href="assignments.html">
          <span class="nav-icon">📚</span> Assignments
        </a>
        <a class="nav-item" data-page="submit" href="upload-submission.html">
          <span class="nav-icon">📤</span> Submit Work
        </a>
        <a class="nav-item" data-page="history" href="submission-history.html">
          <span class="nav-icon">📋</span> My Submissions
        </a>
        <div class="nav-section"><span class="nav-section-label">Account</span></div>
        <a class="nav-item" data-page="profile" href="profile.html">
          <span class="nav-icon">👤</span> Profile
        </a>
        <a class="nav-item" onclick="logout()">
          <span class="nav-icon">🚪</span> Sign Out
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-widget">
          <div class="user-avatar" id="sidebar-avatar">ST</div>
          <div>
            <div class="user-name" id="sidebar-name">Loading…</div>
            <div class="user-role">Student</div>
          </div>
          <button class="user-logout" onclick="logout()" title="Sign out">🚪</button>
        </div>
      </div>
    </aside>

    <!-- ── MAIN ── -->
    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle btn btn-ghost btn-icon" id="menu-toggle">☰</button>
        <h1 class="topbar-title">Student Dashboard</h1>
        <div class="topbar-actions">
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search assignments…" id="global-search" />
          </div>
          <button class="notif-btn" id="notif-btn" title="Notifications">
            🔔 <span class="notif-dot" id="notif-dot" style="display:none;"></span>
          </button>
        </div>
      </header>

      <div class="page-content" id="page-content">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-db.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const user = API.requireRole('student', '../pages/login.html');
    if (!user) throw new Error('Not authenticated');

    showMockBanner();
    initSidebar();

    document.getElementById('sidebar-name').textContent = user.name;
    document.getElementById('sidebar-avatar').textContent = getInitials(user.name);

    // Connect menu toggle
    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('mobile-open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    });
    document.getElementById('sidebar-overlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    });

    let allAssignments = [];
    let allSubmissions = [];
    let currentPage = 1;
    const PAGE_SIZE = 6;
    let filterStatus = 'all';
    let searchQuery = '';

    async function loadDashboard() {
      try {
        const [asgnRes, subRes, statsRes] = await Promise.all([
          API.Assignments.getAll(),
          API.Submissions.getByStudent(user.userId),
          API.Stats.forStudent(user.userId),
        ]);

        allAssignments = asgnRes.assignments || [];
        allSubmissions = subRes.submissions || [];
        const stats = statsRes;

        renderDashboard(stats);
      } catch (err) {
        document.getElementById('page-content').innerHTML = `
          <div class="alert alert-danger">
            <span class="alert-icon">❌</span> Failed to load dashboard. ${escapeHtml(err.message)}
          </div>`;
      }
    }

    function renderDashboard(stats) {
      // Check upcoming deadlines
      const now = new Date();
      const urgent = allAssignments.filter(a => {
        const dl = new Date(a.deadline);
        const diff = dl - now;
        return diff > 0 && diff < 3 * 86400000 && !allSubmissions.find(s => s.assignmentId === a.assignmentId);
      });
      if (urgent.length > 0) {
        document.getElementById('notif-dot').style.display = 'block';
      }

      const html = `
        <!-- Welcome Banner -->
        <div class="welcome-banner">
          <h2>Welcome back, ${escapeHtml(user.name.split(' ')[0])}! 👋</h2>
          <p>You have <strong>${stats.pending || 0} pending assignment${stats.pending !== 1 ? 's' : ''}</strong> and <strong>${stats.submitted || 0} submitted</strong>.</p>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-4 gap-4 mb-6" style="margin-bottom:var(--space-6);">
          <div class="stat-card">
            <div class="stat-icon purple">📚</div>
            <div>
              <div class="stat-value">${stats.total || 0}</div>
              <div class="stat-label">Total Assignments</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon cyan">⏳</div>
            <div>
              <div class="stat-value">${stats.pending || 0}</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div>
              <div class="stat-value">${stats.submitted || 0}</div>
              <div class="stat-label">Submitted</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon red">⚠️</div>
            <div>
              <div class="stat-value">${stats.overdue || 0}</div>
              <div class="stat-label">Overdue</div>
            </div>
          </div>
        </div>

        <!-- Upcoming Deadlines Sidebar -->
        ${urgent.length ? `
        <div class="card mb-6" style="margin-bottom:var(--space-6);">
          <div class="card-header">
            <span class="card-title">⏰ Urgent — Deadlines Within 3 Days</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${urgent.map(a => {
              const cd = deadlineCountdown(a.deadline);
              return `
              <div class="upcoming-deadline">
                <div>
                  <div style="font-weight:600;font-size:.9rem;">${escapeHtml(a.title)}</div>
                  <div style="font-size:.8rem;color:var(--gray-500);">Deadline: ${formatDateTime(a.deadline)}</div>
                </div>
                <span class="deadline-chip danger">${cd.text}</span>
              </div>`;
            }).join('')}
          </div>
        </div>` : ''}

        <!-- Filter Bar -->
        <div class="flex items-center justify-between flex-wrap gap-3" style="margin-bottom:var(--space-4);">
          <h3 style="font-size:1.125rem;font-weight:700;">📋 All Assignments</h3>
          <div class="filter-bar" style="margin-bottom:0;">
            <div class="filter-search">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Search…" id="search-input" value="${escapeHtml(searchQuery)}" />
            </div>
            <select class="form-control" id="status-filter" style="max-width:160px;">
              <option value="all" ${filterStatus==='all'?'selected':''}>All Status</option>
              <option value="pending" ${filterStatus==='pending'?'selected':''}>Pending</option>
              <option value="submitted" ${filterStatus==='submitted'?'selected':''}>Submitted</option>
              <option value="overdue" ${filterStatus==='overdue'?'selected':''}>Overdue</option>
            </select>
          </div>
        </div>

        <!-- Assignment Cards -->
        <div id="assignments-grid"></div>
        <div id="pagination-container"></div>
      `;

      document.getElementById('page-content').innerHTML = html;

      // Wire up search & filter
      document.getElementById('search-input').addEventListener('input', debounce(e => {
        searchQuery = e.target.value;
        currentPage = 1;
        renderAssignments();
      }, 300));
      document.getElementById('status-filter').addEventListener('change', e => {
        filterStatus = e.target.value;
        currentPage = 1;
        renderAssignments();
      });

      renderAssignments();
    }

    function renderAssignments() {
      const now = new Date();
      let filtered = allAssignments.filter(a => {
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          if (!a.title.toLowerCase().includes(q) && !a.description.toLowerCase().includes(q)) return false;
        }
        const sub = allSubmissions.find(s => s.assignmentId === a.assignmentId);
        const expired = new Date(a.deadline) < now;

        if (filterStatus === 'pending' && (sub || expired)) return false;
        if (filterStatus === 'submitted' && !sub) return false;
        if (filterStatus === 'overdue' && (sub || !expired)) return false;
        return true;
      });

      // Sort: active first, then deadline asc
      filtered.sort((a, b) => {
        const aExp = new Date(a.deadline) < now;
        const bExp = new Date(b.deadline) < now;
        if (aExp !== bExp) return aExp ? 1 : -1;
        return new Date(a.deadline) - new Date(b.deadline);
      });

      const pg = paginate(filtered, currentPage, PAGE_SIZE);

      if (pg.items.length === 0) {
        document.getElementById('assignments-grid').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No assignments found</h3>
            <p>${filterStatus !== 'all' ? 'Try changing the filter.' : 'No assignments available yet.'}</p>
          </div>`;
        document.getElementById('pagination-container').innerHTML = '';
        return;
      }

      const cards = pg.items.map(a => {
        const sub = allSubmissions.find(s => s.assignmentId === a.assignmentId);
        const expired = new Date(a.deadline) < now;
        const cd = deadlineCountdown(a.deadline);
        const cardClass = sub ? (sub.isLate ? 'late' : 'submitted') : (expired ? 'overdue' : '');

        let chipClass = 'safe';
        if (cd.expired) chipClass = 'expired';
        else if (cd.class === 'deadline-danger') chipClass = 'danger';
        else if (cd.class === 'deadline-warning') chipClass = 'warning';

        return `
        <div class="assignment-card ${cardClass}">
          <div class="flex items-center justify-between gap-2">
            <div class="asgn-title">${escapeHtml(a.title)}</div>
            ${submissionStatusBadge(sub, a.deadline)}
          </div>
          <div class="asgn-desc">${escapeHtml(a.description)}</div>
          <div class="asgn-meta">
            <span class="asgn-meta-item">👩‍🏫 ${escapeHtml(a.facultyName || 'Faculty')}</span>
            <span class="asgn-meta-item">🏆 ${a.totalMarks} marks</span>
            <span class="deadline-chip ${chipClass}">⏰ ${cd.text}</span>
            ${a.allowLate ? '<span style="font-size:.75rem;color:var(--warning);font-weight:600;">Late OK</span>' : ''}
          </div>
          <div style="font-size:.8125rem;color:var(--gray-400);">Deadline: ${formatDateTime(a.deadline)}</div>
          ${sub ? `<div style="font-size:.8125rem;color:var(--success);">✅ Submitted: ${formatDateTime(sub.submittedAt)} — ${escapeHtml(sub.fileName || 'File')}</div>` : ''}
          <div class="asgn-actions">
            <a href="assignment-detail.html?id=${a.assignmentId}" class="btn btn-outline btn-sm">View Details</a>
            ${!sub && (!expired || a.allowLate) ? `<a href="upload-submission.html?assignmentId=${a.assignmentId}" class="btn btn-primary btn-sm">📤 Submit</a>` : ''}
            ${sub ? `<a href="upload-submission.html?assignmentId=${a.assignmentId}" class="btn btn-ghost btn-sm">🔄 Resubmit</a>` : ''}
          </div>
        </div>`;
      }).join('');

      document.getElementById('assignments-grid').innerHTML = `<div class="grid grid-cols-2 gap-4">${cards}</div>`;
      renderPagination('pagination-container', pg, page => { currentPage = page; renderAssignments(); });
    }

    // Global search in topbar
    document.getElementById('global-search').addEventListener('input', debounce(e => {
      searchQuery = e.target.value;
      const si = document.getElementById('search-input');
      if (si) si.value = searchQuery;
      currentPage = 1;
      renderAssignments();
    }, 300));

    loadDashboard();
  </script>
</body>
</html>
