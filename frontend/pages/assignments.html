<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments — EduCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css" />
  <style>
    .asgn-item {
      background: var(--bg-card); border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
      padding: var(--space-5); display: flex; align-items: center; gap: var(--space-5);
      transition: all var(--transition-fast); flex-wrap: wrap;
    }
    .asgn-item:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
    .asgn-icon { width: 48px; height: 48px; border-radius: var(--radius-md); background: linear-gradient(135deg, #ede9fe, #ddd6fe); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; }
    .asgn-info { flex: 1; min-width: 180px; }
    .asgn-name { font-weight: 700; font-size: .9375rem; color: var(--gray-900); margin-bottom: 2px; }
    .asgn-desc { font-size: .8125rem; color: var(--gray-500); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .view-toggle { display: flex; gap: 6px; }
    .view-btn { padding: 6px 10px; border-radius: 6px; font-size: .8125rem; background: var(--gray-100); color: var(--gray-600); border: none; cursor: pointer; }
    .view-btn.active { background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🎓</div>
        <div><div class="sidebar-logo-text">EduCloud</div><div class="sidebar-logo-sub">Student Portal</div></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><span class="nav-section-label">Main</span></div>
        <a class="nav-item" href="student-dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a class="nav-item active" href="assignments.html"><span class="nav-icon">📚</span> Assignments</a>
        <a class="nav-item" href="upload-submission.html"><span class="nav-icon">📤</span> Submit Work</a>
        <a class="nav-item" href="submission-history.html"><span class="nav-icon">📋</span> My Submissions</a>
        <div class="nav-section"><span class="nav-section-label">Account</span></div>
        <a class="nav-item" href="profile.html"><span class="nav-icon">👤</span> Profile</a>
        <a class="nav-item" onclick="logout()"><span class="nav-icon">🚪</span> Sign Out</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-widget">
          <div class="user-avatar" id="sidebar-avatar">ST</div>
          <div><div class="user-name" id="sidebar-name">Student</div><div class="user-role">Student</div></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle btn btn-ghost btn-icon" id="menu-toggle">☰</button>
        <h1 class="topbar-title">Assignments</h1>
        <div class="topbar-actions">
          <a href="upload-submission.html" class="btn btn-primary btn-sm">📤 Submit</a>
        </div>
      </header>

      <div class="page-content" id="page-content">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-db.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const user = API.requireRole('student', 'login.html');
    if (!user) throw new Error();

    showMockBanner();
    document.getElementById('sidebar-name').textContent = user.name;
    document.getElementById('sidebar-avatar').textContent = getInitials(user.name);

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('mobile-open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    });

    let allAssignments = [], mySubmissions = [];
    let view = 'grid', page = 1, query = '', statusFilter = 'all', sortBy = 'deadline';

    async function load() {
      const [ar, sr] = await Promise.all([API.Assignments.getAll(), API.Submissions.getByStudent(user.userId)]);
      allAssignments = ar.assignments || [];
      mySubmissions  = sr.submissions || [];
      renderPage();
    }

    function renderPage() {
      const now = new Date();
      let filtered = allAssignments.filter(a => {
        if (query) {
          const q = query.toLowerCase();
          if (!a.title.toLowerCase().includes(q) && !(a.description||'').toLowerCase().includes(q) && !(a.facultyName||'').toLowerCase().includes(q)) return false;
        }
        const sub = mySubmissions.find(s => s.assignmentId === a.assignmentId);
        const expired = new Date(a.deadline) < now;
        if (statusFilter === 'pending' && (sub || expired)) return false;
        if (statusFilter === 'submitted' && !sub) return false;
        if (statusFilter === 'overdue' && (sub || !expired)) return false;
        if (statusFilter === 'active' && expired) return false;
        if (statusFilter === 'closed' && !expired) return false;
        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'deadline') return new Date(a.deadline) - new Date(b.deadline);
        if (sortBy === 'deadline-desc') return new Date(b.deadline) - new Date(a.deadline);
        if (sortBy === 'title') return a.title.localeCompare(b.title);
        if (sortBy === 'marks') return b.totalMarks - a.totalMarks;
        return 0;
      });

      const pg = paginate(filtered, page, 8);

      let html = `
        <!-- Header row -->
        <div class="page-header">
          <div class="page-header-text">
            <h2>All Assignments</h2>
            <p>${filtered.length} assignment${filtered.length !== 1 ? 's' : ''} found</p>
          </div>
          <div class="view-toggle">
            <button class="view-btn ${view==='grid'?'active':''}" onclick="setView('grid')">⊞ Grid</button>
            <button class="view-btn ${view==='list'?'active':''}" onclick="setView('list')">☰ List</button>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar" style="margin-bottom:var(--space-5);">
          <div class="filter-search">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search assignments…" id="search-input" value="${escapeHtml(query)}" />
          </div>
          <select class="form-control" id="status-filter" style="max-width:140px;">
            <option value="all" ${statusFilter==='all'?'selected':''}>All Status</option>
            <option value="active" ${statusFilter==='active'?'selected':''}>Active</option>
            <option value="pending" ${statusFilter==='pending'?'selected':''}>Pending</option>
            <option value="submitted" ${statusFilter==='submitted'?'selected':''}>Submitted</option>
            <option value="overdue" ${statusFilter==='overdue'?'selected':''}>Overdue</option>
            <option value="closed" ${statusFilter==='closed'?'selected':''}>Closed</option>
          </select>
          <select class="form-control" id="sort-select" style="max-width:160px;">
            <option value="deadline" ${sortBy==='deadline'?'selected':''}>Deadline ↑</option>
            <option value="deadline-desc" ${sortBy==='deadline-desc'?'selected':''}>Deadline ↓</option>
            <option value="title" ${sortBy==='title'?'selected':''}>Title A–Z</option>
            <option value="marks" ${sortBy==='marks'?'selected':''}>Most Marks</option>
          </select>
        </div>

        <!-- Items -->
        ${pg.items.length === 0
          ? `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>No assignments found</h3><p>Try different filters.</p></div>`
          : view === 'grid'
            ? `<div class="grid grid-cols-2 gap-4">${pg.items.map(renderCard).join('')}</div>`
            : `<div style="display:flex;flex-direction:column;gap:12px;">${pg.items.map(renderRow).join('')}</div>`
        }
        <div id="pagination-container"></div>
      `;

      document.getElementById('page-content').innerHTML = html;

      document.getElementById('search-input').addEventListener('input', debounce(e => { query = e.target.value; page = 1; renderPage(); }, 300));
      document.getElementById('status-filter').addEventListener('change', e => { statusFilter = e.target.value; page = 1; renderPage(); });
      document.getElementById('sort-select').addEventListener('change', e => { sortBy = e.target.value; page = 1; renderPage(); });

      renderPagination('pagination-container', pg, p => { page = p; renderPage(); });
    }

    function renderCard(a) {
      const sub = mySubmissions.find(s => s.assignmentId === a.assignmentId);
      const cd = deadlineCountdown(a.deadline);
      const now = new Date();
      const expired = new Date(a.deadline) < now;

      let border = '';
      if (sub) border = 'border-color:var(--success);';
      else if (expired) border = 'border-color:var(--danger);';

      return `
      <div class="card" style="${border}position:relative;overflow:hidden;">
        <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${sub?'var(--success)':expired?'var(--danger)':'var(--primary)'};"></div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;">
          <div style="font-weight:700;font-size:.9375rem;">${escapeHtml(a.title)}</div>
          ${submissionStatusBadge(sub, a.deadline)}
        </div>
        <p style="font-size:.8125rem;color:var(--gray-500);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${escapeHtml(a.description)}</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--gray-500);margin-bottom:14px;">
          <span>👩‍🏫 ${escapeHtml(a.facultyName||'Faculty')}</span>
          <span>🏆 ${a.totalMarks} marks</span>
          <span class="${cd.class}">⏰ ${cd.text}</span>
        </div>
        <div style="display:flex;gap:8px;">
          <a href="assignment-detail.html?id=${a.assignmentId}" class="btn btn-outline btn-sm" style="flex:1;justify-content:center;">View</a>
          ${!sub && (!expired || a.allowLate) ? `<a href="upload-submission.html?assignmentId=${a.assignmentId}" class="btn btn-primary btn-sm">Submit</a>` : ''}
        </div>
      </div>`;
    }

    function renderRow(a) {
      const sub = mySubmissions.find(s => s.assignmentId === a.assignmentId);
      const cd = deadlineCountdown(a.deadline);
      const now = new Date();
      const expired = new Date(a.deadline) < now;

      return `
      <div class="asgn-item">
        <div class="asgn-icon">📋</div>
        <div class="asgn-info">
          <div class="asgn-name">${escapeHtml(a.title)}</div>
          <div class="asgn-desc">${escapeHtml(a.description)}</div>
          <div style="font-size:.75rem;color:var(--gray-400);margin-top:4px;">👩‍🏫 ${escapeHtml(a.facultyName||'Faculty')} · 🏆 ${a.totalMarks} marks</div>
        </div>
        <div style="text-align:center;min-width:100px;">
          <div class="${cd.class}" style="font-size:.8125rem;font-weight:700;">${cd.text}</div>
          <div style="font-size:.7rem;color:var(--gray-400);">${formatDate(a.deadline)}</div>
        </div>
        <div>${submissionStatusBadge(sub, a.deadline)}</div>
        <div style="display:flex;gap:8px;">
          <a href="assignment-detail.html?id=${a.assignmentId}" class="btn btn-ghost btn-sm">View</a>
          ${!sub && (!expired || a.allowLate) ? `<a href="upload-submission.html?assignmentId=${a.assignmentId}" class="btn btn-primary btn-sm">Submit</a>` : ''}
        </div>
      </div>`;
    }

    function setView(v) { view = v; renderPage(); }

    load();
  </script>
</body>
</html>
